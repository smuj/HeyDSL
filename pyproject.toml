[project]
name = "heydsl"
version = "1.0.1"
description = "A lightweight local web UI for editing custom DSLs with live HTML preview"
readme = "README.md"
authors = [
    { name = "SMuJ", email = "55206+smuj@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "flask>=3.1.3",
    "nh3>=0.3.4",
]

[project.scripts]
heydsl = "heydsl:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.urls]
Repository = "https://github.com/smuj/HeyDSL"
