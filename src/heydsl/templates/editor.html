<!-- editor.html -->
<!doctype html>
<html>

<head>
    <meta charset="utf-8">

    {% for s in stylesheets %}
    <link rel="stylesheet" href="{{ s.url }}" {% if s.integrity %}integrity="{{ s.integrity }}" {%endif%}
        crossorigin="anonymous" referrerpolicy="no-referrer">
    {% endfor %}

    {% for s in scripts %}
    <script src="{{ s.url }}" {% if s.integrity %}integrity="{{ s.integrity }}" {%endif%} crossorigin="anonymous"
        referrerpolicy="no-referrer"></script>
    {% endfor %}

    <!-- DSL language mode (injected by server) -->
    <script src="{{ url_for('syntax_def') }}"></script>

    <link rel="stylesheet" href="{{ url_for('static', filename='editor.css') }}">
</head>

<body>
    <div class="page">
        <header class="header">
            <h1>{{ header_text }}</h1>
            <div class="controls">
                <select id="themeSelect" class="dropdown">
                    {% for name in theme_names %}
                    <option value="{{ name }}">{{ name }}</option>
                    {% endfor %}
                </select>
                <button id="saveAsBtn">💾 Save As</button>
                <button id="loadBtn">📂 Load</button>
                <button id="compileBtn">⚙️ Compile</button>
                <input type="file" id="fileInput" style="display:none;">
            </div>
        </header>

        <div class="content">
            <div class="pane">
                <h2 class="pane-title">Editor</h2>
                <div class="pane-content">
                    <textarea id="editor">{{ initial_code }}</textarea>
                </div>
            </div>
            <div class="pane">
                <h2 class="pane-title">Preview</h2>
                <div class="pane-content">
                    <iframe id="previewFrame" sandbox="{{ sandbox }}">
                    </iframe>
                </div>

            </div>
        </div>
    </div>

    <script>
        // Initialize editor
        var editor = CodeMirror.fromTextArea(document.getElementById("editor"), {
            lineNumbers: true,
            mode: "{{ syntax_name }}",
            theme: localStorage.getItem("cmTheme") || "{{ theme_names[0] }}"
        });

        // Theme dropdown
        var themeSelect = document.getElementById("themeSelect");

        // Set initial dropdown value
        themeSelect.value = editor.getOption("theme");

        themeSelect.addEventListener("change", function () {
            var newTheme = themeSelect.value;
            editor.setOption("theme", newTheme);
            localStorage.setItem("cmTheme", newTheme);
        });

        // Preview functionality
        var previewUpdateTimeout;

        function updatePreview() {
            var code = editor.getValue();

            fetch("/api/preview", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ code })
            })
                .then(response => response.json())
                .then(data => {
                    const iframe = document.getElementById("previewFrame");
                    if (data.html !== undefined) {
                        iframe.srcdoc = data.html;
                    } else if (data.error) {
                        iframe.srcdoc =
                            "<p style='padding:1rem; color:#d44;'>Error: " +
                            data.error.replace(/</g, "&lt;").replace(/>/g, "&gt;") +
                            "</p>";
                    }
                })
                .catch(error => {
                    const iframe = document.getElementById("previewFrame");
                    iframe.srcdoc =
                        "<p style='padding:1rem; color:#d44;'>Preview error: " +
                        error.message.replace(/</g, "&lt;").replace(/>/g, "&gt;") +
                        "</p>";
                });
        }

        editor.on("change", function () {
            clearTimeout(previewUpdateTimeout);
            previewUpdateTimeout = setTimeout(updatePreview, 300);
        });

        updatePreview();

        // Save As
        document.getElementById("saveAsBtn").addEventListener("click", async function () {
            try {
                const code = editor.getValue();
                const response = await fetch("/api/save-as", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ code })
                });

                const data = await response.json();
                if (!response.ok) {
                    alert("Save failed: " + data.error);
                }
            } catch (error) {
                alert("Save error: " + error.message);
            }
        });

        // Load (browser file input)
        document.getElementById("loadBtn").addEventListener("click", function () {
            document.getElementById("fileInput").click();
        });

        document.getElementById("fileInput").addEventListener("change", function (e) {
            var file = e.target.files[0];
            if (file) {
                var reader = new FileReader();
                reader.onload = function (event) {
                    editor.setValue(event.target.result);
                };
                reader.readAsText(file);
            }
        });

        // Compile and save
        document.getElementById("compileBtn").addEventListener("click", async function () {
            try {
                const code = editor.getValue();
                const response = await fetch("/api/compile", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ code })
                });

                const data = await response.json();
                if (!response.ok) {
                    alert("Compile failed: " + data.error);
                }
            } catch (error) {
                alert("Compile error: " + error.message);
            }
        });
    </script>
</body>

</html>
